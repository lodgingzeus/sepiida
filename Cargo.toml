[workspace]
resolver = "3"
members = ["crates/sepiida-core", "crates/sepiida", "crates/sepiida-hook"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/lodgingzeus/sepiida"

[workspace.dependencies]
sepiida-core = { path = "crates/sepiida-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "gif", "webp"] }
material-colors = { version = "0.5", features = ["quantize"] }
palette = "0.7"
notify = "8"
directories = "6"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "system-tray"] }
slint-build = "1.18"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The hook DLL runs inside explorer.exe and must catch panics at every FFI
# boundary, so the whole workspace keeps the default panic = "unwind".
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
